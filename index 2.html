<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dina's Birthday Invitation</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 25%,#fcf9f2,#e9e1d4);font-family:Georgia,serif;color:#6b593c;display:grid;place-items:center;overflow-x:hidden}.stage{width:min(94vw,440px);text-align:center;padding:25px 0}.start{min-height:70dvh;display:grid;place-content:center;justify-items:center;gap:28px}.ornament{font-size:36px;color:#bc995b}.start button,.actions a,.actions button{border:1px solid #b89b60;background:linear-gradient(135deg,#fffaf0,#eee1c7);color:#7d6037;border-radius:40px;padding:16px 27px;font:17px Georgia,serif;cursor:pointer;box-shadow:0 8px 22px #8a744126}.start button{letter-spacing:1.5px}.intro{font-style:italic;font-size:17px}.scene{display:none;position:relative;perspective:1100px}.scene.active{display:block}.envelope{position:relative;width:100%;aspect-ratio:960/1601;overflow:hidden;box-shadow:0 16px 40px #65513b35;animation:appear .9s ease both}.envelope img{width:100%;height:100%;object-fit:cover;display:block}.seal-overlay{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer}.instruction{font-size:13px;letter-spacing:1.5px;margin:17px 0}.scene.revealing .envelope{animation:depart 1.3s ease-in forwards}.scene.revealing .instruction{opacity:0}.invite{display:none}.invite.active{display:block;animation:reveal 1.15s cubic-bezier(.2,.8,.2,1) both}.invite img{width:100%;display:block;box-shadow:0 16px 40px #65513b35}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:20px 0}.actions a,.actions button{font-size:13px;padding:12px 16px;text-decoration:none}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:scale(.84) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes depart{0%{opacity:1;transform:rotateX(0) scale(1)}45%{opacity:1;transform:rotateX(-12deg) scale(1.035)}100%{opacity:0;transform:translateY(-120px) rotateX(-20deg) scale(.9)}}@keyframes reveal{from{opacity:0;transform:translateY(65px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head><body><main class="stage"><section class="start" id="start"><div class="ornament">✧ ♡ ✧</div><div class="intro">You're invited to celebrate Dina</div><button id="begin">Open Invitation ✉</button></section><section class="scene" id="scene" aria-label="Ivory floral envelope with gold seal"><div class="envelope" id="envelope"><img src="envelope.png" alt="Off-white embossed floral envelope with gold wax seal"><button class="seal-overlay" id="seal" aria-label="Open the envelope" style="border:0;background:transparent"></button></div><p class="instruction">TAP THE GOLD SEAL TO REVEAL</p></section><section class="invite" id="invite"><img src="card.jpg" alt="Dina birthday invitation, 29 October 2026, 18:00–22:00, Cielo Tehran Restaurant"><div class="actions"><a href="https://www.google.com/maps/search/?api=1&query=Cielo+Tehran+Restaurant" target="_blank" rel="noopener">⌖ View venue</a><a id="calendar" download="dina-birthday.ics">♡ Add to calendar</a><button id="replay">Replay animation ↺</button></div></section></main><script>
const start=document.getElementById('start'),scene=document.getElementById('scene'),invite=document.getElementById('invite');document.getElementById('begin').onclick=()=>{start.classList.add('hidden');scene.classList.add('active')};let busy=false;function reveal(){if(busy)return;busy=true;scene.classList.add('revealing');setTimeout(()=>{scene.classList.remove('active','revealing');invite.classList.add('active');busy=false},1200)}document.getElementById('seal').onclick=reveal;document.getElementById('envelope').onclick=reveal;document.getElementById('replay').onclick=()=>{invite.classList.remove('active');start.classList.remove('hidden')};const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dina Birthday//EN','BEGIN:VEVENT','UID:dina-birthday-20261029@example.invalid','DTSTAMP:20261022T120000Z','DTSTART:20261029T143000Z','DTEND:20261029T183000Z','SUMMARY:Dina Birthday Celebration','LOCATION:Cielo Tehran Restaurant','END:VEVENT','END:VCALENDAR'].join('\r\n');document.getElementById('calendar').href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
</script></body></html>
